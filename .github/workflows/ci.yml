# Cross-platform CI for xats-setup.
#
# This is the project's own buildfarm: GitHub-hosted runners, so it never
# contends with a shared worker lease, and it is the only practical way to cover
# macOS — which had zero verification before this workflow existed.
#
# Two jobs:
#   test          - the suite on Linux/macOS/Windows x Node 22 and 24
#   install-smoke - the installer, in a sandboxed HOME, so it cannot touch the
#                   runner's real home or install a service
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Build the daemon (the endpoint test needs daemon/dist)
        run: npm run build:daemon
      - name: Test
        # The suite spawns daemons and binds loopback ports; keep the output in
        # the log for post-mortem and do not retry, so flakes stay visible.
        run: npm test
      - name: Assert the suite was not silently truncated
        # A glob that matches fewer files still exits 0. Compare the reported test
        # count against the number of test files we actually ship.
        shell: bash
        run: |
          files=$(ls test/*.test.mjs | wc -l)
          echo "test files: $files"
          test "$files" -ge 20 || { echo "unexpectedly few test files"; exit 1; }

  install-smoke:
    name: install smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Dry run first: proves argument parsing without writing anything.
      - name: Dry run (unix)
        if: runner.os != 'Windows'
        run: node install.mjs --dry-run --yes --only=pi,opencode

      - name: Dry run (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: node install.mjs --dry-run --yes --only=pi,opencode

      # Real install into a sandboxed home. No daemon, no service, no peer
      # listener: only the filesystem components an agent needs.
      - name: Install into sandbox (unix)
        if: runner.os != 'Windows'
        env:
          # Runner images set XDG_CONFIG_HOME pointing at the real home; the
          # opencode path resolves from it, so sandboxing needs both.
          HOME: ${{ runner.temp }}/home
          XDG_CONFIG_HOME: ${{ runner.temp }}/home/.config
        run: |
          mkdir -p "$HOME/.config/opencode"
          node install.mjs --only=pi,opencode -y --no-ephemeral
          test -f "$HOME/.pi/agent/extensions/xats.ts"
          test -f "$HOME/.pi/agent/skills/xats/SKILL.md"
          test -f "$HOME/.config/opencode/plugins/xats-register.ts"
          echo "sandbox install OK"

      - name: Install into sandbox (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sandbox = Join-Path $env:RUNNER_TEMP 'home'
          New-Item -ItemType Directory -Force -Path $sandbox | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $sandbox '.config\opencode') | Out-Null
          $env:HOME = $sandbox
          $env:USERPROFILE = $sandbox
          $env:XDG_CONFIG_HOME = Join-Path $sandbox '.config'
          node install.mjs --only=pi,opencode -y --no-ephemeral
          if (-not (Test-Path (Join-Path $sandbox '.pi\agent\extensions\xats.ts'))) { throw 'pi extension missing' }
          if (-not (Test-Path (Join-Path $sandbox '.pi\agent\skills\xats\SKILL.md'))) { throw 'pi skill missing' }
          if (-not (Test-Path (Join-Path $sandbox '.config\opencode\plugins\xats-register.ts'))) { throw 'opencode plugin missing' }
          Write-Output 'sandbox install OK'

  # The suite skips 10 daemon-backed tests on a clean checkout (they need fastify
  # + better-sqlite3). Skipping is right for contributors, but CI must run them:
  # they cover per-session identity, name takeover and inbox isolation.
  #
  # `cross-agent-teams-mcp` is a devDependency, so `npm ci` already provides
  # fastify and better-sqlite3 — no second install, no floating transitive tree.
  test-daemon:
    name: test with daemon deps (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Pin the macOS images: `macos-latest` moves, and native ABI is the thing
        # under suspicion. 13 is x64, 14 is arm64.
        os: [ubuntu-latest, macos-13, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the daemon (the endpoint test needs daemon/dist)
        run: npm run build:daemon

      - name: Preflight native deps
        shell: bash
        run: |
          node -e "
            const os = require('node:os');
            console.log('platform :', process.platform, process.arch);
            console.log('os       :', os.type(), os.release());
            // The daemon derives its device label from this; a hostname that
            // normalises to empty makes it exit with invalid_device_label.
            console.log('hostname :', JSON.stringify(os.hostname()), 'len', os.hostname().length);
            console.log('fastify  :', require.resolve('fastify'));
            const Database = require('better-sqlite3');
            const db = new Database(':memory:');
            db.exec('create table t(x)'); db.prepare('insert into t values (1)').run();
            console.log('sqlite   :', db.prepare('select count(*) c from t').get().c, 'row(s)');
            console.log('native   :', require.resolve('better-sqlite3/build/Release/better_sqlite3.node'));
            db.close();
          "
          # The file type tells us arm64 vs x86_64 even when node's arch says otherwise.
          NATIVE=$(node -p "require.resolve('better-sqlite3/build/Release/better_sqlite3.node')")
          file "$NATIVE" || true

      - name: Test with daemon dependencies
        shell: bash
        env:
          XATS_SETUP_TEST_DEPS: ${{ github.workspace }}/node_modules
        run: |
          npm test 2>&1 | tee "$RUNNER_TEMP/test.log"
          status=${PIPESTATUS[0]}
          # Assert by test NAME, never by total count: a hardcoded number goes
          # stale the moment a test is added, and it hides which test mattered.
          # One skip is legitimate — the routed-namespace E2E needs Linux root +
          # netns, which a hosted runner does not grant — so requiring zero skips
          # would fail for the wrong reason.
          grep -q "# fail 0" "$RUNNER_TEMP/test.log" || { echo "::error::suite reported failures"; exit 1; }
          grep -qE "^ok [0-9]+ - same preferred name from two sessions stays two distinct identities$" "$RUNNER_TEMP/test.log" \
            || { echo "::error::daemon-backed identity tests skipped instead of running"; exit 1; }
          grep -qE "^ok [0-9]+ - every REST endpoint the adapters rely on exists and answers$" "$RUNNER_TEMP/test.log" \
            || { echo "::error::endpoint coverage skipped instead of running"; exit 1; }
          exit "$status"

  # The daemon is our source now (daemon/src). Build it and prove the endpoint
  # set the adapters depend on, so a build can never silently drop a route the
  # way the vendored bundle did (it shipped 8 routes while its map described 3).
  daemon:
    name: daemon build + endpoints (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the daemon from source
        run: npm run build:daemon
      - name: Assert the build contains every intended endpoint
        shell: bash
        run: |
          # The intended set is 8, not the 9 the old vendored bundle served:
          # /api/events (SSE) was removed on purpose and the pi adapter polls.
          missing=0
          for route in api/send api/inbox api/agents api/agents/all api/register api/deregister api/heartbeat api/whoami; do
            grep -q "$route" daemon/dist/cli.js || { echo "::error::daemon build is missing $route"; missing=1; }
          done
          exit $missing
      - name: Source and build must expose the same routes
        shell: bash
        run: |
          # The vendored bundle shipped 8 routes while its source described 3 and
          # nothing noticed. Compare the two directly and fail on any drift.
          src=$(grep -oE "'/api/[a-z_/]+'" daemon/src/daemon/rest-api.ts | tr -d "'" | sed 's|^/||' | sort -u)
          dist=$(grep -oE "api/[a-z_/]+" daemon/dist/cli.js | sort -u)
          echo "--- source ---"; echo "$src"
          echo "--- build ---";  echo "$dist"
          extra=$(comm -13 <(echo "$src") <(echo "$dist") || true)
          absent=$(comm -23 <(echo "$src") <(echo "$dist") || true)
          if [ -n "$absent" ]; then echo "::error::build is missing routes present in source: $absent"; exit 1; fi
          if [ -n "$extra" ]; then echo "::warning::build has routes not in source: $extra"; fi
      - name: Demo (two agents, one message, end to end)
        shell: bash
        env:
          XATS_SETUP_TEST_DEPS: ${{ github.workspace }}/node_modules
        run: node scripts/demo.mjs --private
      - name: Endpoint + session_key smoke
        shell: bash
        env:
          XATS_SETUP_TEST_DEPS: ${{ github.workspace }}/node_modules
        run: |
          # Run the whole suite (the daemon tests need deps) and require the
          # endpoint test to have PASSED by name — a skip must not look green.
          npm test 2>&1 | tee "$RUNNER_TEMP/daemon-test.log"
          status=${PIPESTATUS[0]}
          grep -qE "^ok [0-9]+ - every REST endpoint the adapters rely on exists and answers$" "$RUNNER_TEMP/daemon-test.log" \
            || { echo "::error::endpoint coverage did not run on this platform"; exit 1; }
          exit "$status"
