# Every PR keeps the full OS/Node matrix, clean packed-install checks, and
# pinned real-host contracts. Do not repeat the full suite in separate jobs.
# Target: about one minute with warm caches, excluding runner queue time.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: complete suite (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    env:
      XATS_SETUP_TEST_DEPS: ${{ github.workspace }}/node_modules
      XATS_TEST_CONCURRENCY: 3
      FORCE_COLOR: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: ${{ matrix.node }}
      # Exact keys only: native addons must never cross OS/architecture/Node or
      # dependency-lock boundaries. Packed-install jobs still run clean npm ci.
      - uses: actions/cache@v4
        id: deps
        with:
          path: node_modules
          key: xats-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'package.json') }}
      - name: Install exact dependencies on a cache miss
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - name: Check dependency tree and native SQLite ABI
        shell: bash
        run: |
          npm ls --depth=0
          node -e "require.resolve('fastify'); const Database=require('better-sqlite3'); const db=new Database(':memory:'); db.exec('create table qc(x)'); db.close(); console.log(process.platform, process.arch, 'Node', process.version, 'native SQLite ready');"
      - name: Build from current source
        run: npm run build:daemon
      - name: Exact source/build API parity
        run: node scripts/check-daemon-routes.mjs
      - name: Run all tests once and require actual critical coverage
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee "$RUNNER_TEMP/test.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          node scripts/assert-ci-coverage.mjs "$RUNNER_TEMP/test.log"
      - name: Real two-agent demo on each OS
        if: matrix.node == 22
        run: node scripts/demo.mjs --private

  install-smoke:
    name: packed install + rerun (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Keep this cache distinct from root-only dependency caches. It must
          # also retain registry metadata/tarballs fetched by the real legacy
          # adapter install, without reusing an installed HOME or test result.
          cache-dependency-path: |
            package-lock.json
            lib/harness.mjs
      # Deliberately clean on every CI: this independently verifies installation
      # scripts and seeds the dependency cache used by the actual packed bin.
      - run: npm ci --no-audit --no-fund
      - run: npm run build:daemon
      - name: Actual npm-bin install, dry-run, preservation and second install
        run: node scripts/smoke-packed-install.mjs

  host-contracts:
    name: pinned real host contracts (no models)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache versioned public host tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/xats-host-tools
          key: xats-host-contracts-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-host-versions.json') }}
      - name: Real Claude/Antigravity validation and official Claude mod tests
        env:
          XATS_CI_HOST_TOOLS: ${{ runner.temp }}/xats-host-tools
        run: node scripts/validate-host-contracts.mjs
